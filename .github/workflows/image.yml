name: image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # DVinyl 4.0.0 has no official image yet, so the build clones the branch and patches it —
      # that ref lives in Dockerfile.source. When a release image appears, switch `file:` back to
      # Dockerfile and the locale is simply layered on top of it.
      - name: Read the DVinyl ref out of Dockerfile.source
        id: upstream
        run: |
          ref=$(awk -F= '/^ARG DV_REF=/ {print $2; exit}' Dockerfile.source)
          echo "value=${ref}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Version without the v prefix
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.source
          push: true
          build-args: |
            DV_REF=${{ steps.upstream.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.title=DVinyl with a Russian locale
            org.opencontainers.image.description=Russian interface locale for DVinyl
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
