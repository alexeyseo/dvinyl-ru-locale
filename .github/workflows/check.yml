name: check-locale

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  locale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Локаль сходится с апстримом
        run: python3 scripts/check-locale.py

      - name: Плюрализация отвечает по-русски
        run: node .github/scripts/pluralization-check.js
