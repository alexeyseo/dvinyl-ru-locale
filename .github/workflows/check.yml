name: check-locale

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  locale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Локаль сходится с апстримом
        run: python3 scripts/check-locale.py

      - name: Плюрализация отвечает по-русски
        run: |
          node -e '
          const ru = require("./locales/ru.json");
          const t = (k, n) => {
            const forms = ["_one", "_few", "_many"];
            const n10 = n % 10, n100 = n % 100;
            const idx = n10 === 1 && n100 !== 11 ? 0 : n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20) ? 1 : 2;
            const key = k + forms[idx];
            return String(ru.lists[key] ?? "").replace("{{count}}", n);
          };
          const cases = [[1, "1 трек"], [3, "3 трека"], [22, "22 трека"], [25, "25 треков"]];
          for (const [n, want] of cases) {
            const got = t("tracks_count", n);
            if (got !== want) { console.error(`плюрализация ${n}: получили «${got}», ждали «${want}»`); process.exit(1); }
          }
          console.log("плюрализация в порядке");
          '
