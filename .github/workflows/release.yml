name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Тег, для которого собрать релиз
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Вытащить заметки из CHANGELOG
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY' > notes.md
          import os, re, pathlib
          tag = os.environ["TAG"]
          version = tag.lstrip("v")

          def section(path):
              text = pathlib.Path(path).read_text(encoding="utf-8")
              # Секция версии — от «## <version>» до следующего «## » или конца файла
              match = re.search(rf"^## {re.escape(version)}.*?(?=^## |\Z)", text, re.S | re.M)
              if not match:
                  return None
              return "\n".join(match.group(0).splitlines()[1:]).strip()

          # Английская секция идёт первой, русская — под спойлером.
          english = section("CHANGELOG.md")
          russian = section("CHANGELOG.ru.md")
          if not english:
              raise SystemExit(f"в CHANGELOG.md нет секции для {version}")
          print(english)
          if russian:
              print()
              print("<details>")
              print("<summary>Русская версия</summary>")
              print()
              print(russian)
              print()
              print("</details>")
          PY

      - name: Создать или обновить релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # --draft=false: пересозданный тег оставляет релиз черновиком, edit его публикует.
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md --draft=false
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi
